# Slime World Manager main configuration

# Only enable this if you don't have any other plugins that generate worlds.
enable_async_world_gen: false

# Plugin language: auto, en, zh_CN (Simplified Chinese), zh_TW (Traditional Chinese).
# "auto" follows the JVM/OS locale (Chinese systems use zh_CN or zh_TW).
language: auto

# If true, on every server start SWM will:
#  1) list all slime worlds from every enabled data source (file/mysql/mongodb)
#  2) auto-register any missing entries into worlds.yml (with loadOnStartup: true)
#  3) load all registered slime worlds (ignores per-world loadOnStartup)
auto_load_all_worlds: true

updater:
  enabled: true
  onjoinmessage: true
