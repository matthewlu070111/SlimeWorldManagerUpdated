name: CI

on:
  push:
    branches: [master, develop, main]
  pull_request:
    branches: [master, develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Maven package
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache NMS local repo
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/spigotmc/spigot
          # Bump key suffix when install strategy changes (e.g. minimal POMs)
          key: nms-codemc-minimalpom-v2-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.github/scripts/install-nms.sh') }}
          restore-keys: |
            nms-codemc-minimalpom-v2-${{ runner.os }}-

      - name: Install NMS from CodeMC
        run: |
          chmod +x .github/scripts/install-nms.sh
          .github/scripts/install-nms.sh

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Collect JARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for f in slimeworldmanager-plugin/target/slimeworldmanager-plugin-*.jar; do
            [[ "$(basename "$f")" == original-* ]] && continue
            cp -v "$f" release-assets/
          done
          for f in slimeworldmanager-classmodifier/target/slimeworldmanager-classmodifier-*.jar; do
            cp -v "$f" release-assets/
          done
          test "$(find release-assets -type f -name '*.jar' | wc -l)" -ge 1

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: slimeworldmanager-plugin
          path: release-assets/slimeworldmanager-plugin-*.jar
          if-no-files-found: error

      - name: Upload classmodifier artifact
        uses: actions/upload-artifact@v4
        with:
          name: slimeworldmanager-classmodifier
          path: release-assets/slimeworldmanager-classmodifier-*.jar
          if-no-files-found: error
