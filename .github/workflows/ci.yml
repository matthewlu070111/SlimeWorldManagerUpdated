name: CI

on:
  push:
    branches: [master, develop, main]
  pull_request:
    branches: [master, develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Java 8 NMS + Java 17 package)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install JDK 8 first (BuildTools for MC ≤ 1.16 requires Java 8)
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Export JAVA8_HOME
        shell: bash
        run: |
          echo "JAVA8_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"
          echo "JAVA8_HOME=${JAVA_HOME}"

      # Default tool chain for Maven + 1.17 BuildTools
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Export JAVA17_HOME
        shell: bash
        run: |
          echo "JAVA17_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${JAVA_HOME}"

      - name: Cache BuildTools / NMS workdir
        uses: actions/cache@v4
        with:
          path: |
            .nms-build
            ~/.m2/repository/org/spigotmc
            ~/.m2/repository/com/destroystokyo
          key: nms-${{ runner.os }}-j8-j17-${{ hashFiles('**/pom.xml', '.github/scripts/install-nms.sh') }}
          restore-keys: |
            nms-${{ runner.os }}-j8-j17-
            nms-${{ runner.os }}-

      - name: Install legacy NMS (BuildTools + Java 8)
        env:
          NMS_GROUP: legacy
        run: |
          chmod +x .github/scripts/install-nms.sh
          .github/scripts/install-nms.sh

      - name: Install modern NMS (BuildTools + Java 17)
        env:
          NMS_GROUP: modern
        run: |
          chmod +x .github/scripts/install-nms.sh
          .github/scripts/install-nms.sh

      - name: Build with Maven (Java 17)
        run: |
          export JAVA_HOME="${JAVA17_HOME}"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          java -version
          mvn -B package -DskipTests

      - name: Collect JARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for f in slimeworldmanager-plugin/target/slimeworldmanager-plugin-*.jar; do
            [[ "$(basename "$f")" == original-* ]] && continue
            cp -v "$f" release-assets/
          done
          for f in slimeworldmanager-classmodifier/target/slimeworldmanager-classmodifier-*.jar; do
            cp -v "$f" release-assets/
          done
          test "$(find release-assets -type f -name '*.jar' | wc -l)" -ge 1

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: slimeworldmanager-plugin
          path: release-assets/slimeworldmanager-plugin-*.jar
          if-no-files-found: error

      - name: Upload classmodifier artifact
        uses: actions/upload-artifact@v4
        with:
          name: slimeworldmanager-classmodifier
          path: release-assets/slimeworldmanager-classmodifier-*.jar
          if-no-files-found: error
