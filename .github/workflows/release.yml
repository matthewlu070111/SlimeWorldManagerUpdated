name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v2.3.0). Leave empty to use the pushed tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            echo "No tag available. Push a v* tag or pass workflow_dispatch.tag."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache NMS local repo
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/spigotmc/spigot
          key: nms-codemc-minimalpom-v2-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.github/scripts/install-nms.sh') }}
          restore-keys: |
            nms-codemc-minimalpom-v2-${{ runner.os }}-

      - name: Install NMS from CodeMC
        run: |
          chmod +x .github/scripts/install-nms.sh
          .github/scripts/install-nms.sh

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Collect release JARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for f in slimeworldmanager-plugin/target/slimeworldmanager-plugin-*.jar; do
            [[ "$(basename "$f")" == original-* ]] && continue
            cp -v "$f" release-assets/
          done
          for f in slimeworldmanager-classmodifier/target/slimeworldmanager-classmodifier-*.jar; do
            cp -v "$f" release-assets/
          done
          test "$(find release-assets -type f -name '*.jar' | wc -l)" -ge 1

      - name: Generate release notes
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -n "${PREV}" ]]; then
            RANGE_LABEL="Changes since \`${PREV}\`"
          else
            RANGE_LABEL="Recent commits"
          fi

          {
            echo "## Slime World Manager \`${TAG}\`"
            echo
            echo "### Supported versions"
            echo
            echo "| Versions | Compile-time NMS | Runtime |"
            echo "|----------|------------------|---------|"
            echo "| **1.8.8 – 1.17.1** | Spigot | Spigot / Paper |"
            echo "| **1.18+** | — | Use [AdvancedSlimeWorldManager](https://github.com/Paul19988/Advanced-Slime-World-Manager) / ASP |"
            echo
            echo "### Platform policy"
            echo
            echo "- **Compile:** Spigot NMS jars (BuildTools)."
            echo "- **Runtime:** Spigot and Paper of the same Minecraft version."
            echo "- Paper-only method patches are optional (ClassModifier)."
            echo
            echo "### Artifacts"
            echo
            echo "- \`slimeworldmanager-plugin-*.jar\` — install into \`plugins/\`"
            echo "- \`slimeworldmanager-classmodifier-*.jar\` — optional Java agent"
            echo
            echo "### ${RANGE_LABEL}"
            echo
            if [[ -n "${PREV}" ]]; then
              git log "${PREV}..${TAG}" --pretty=format:'- %s (%h)' --no-merges || true
            else
              git log -n 40 "${TAG}" --pretty=format:'- %s (%h)' --no-merges || true
            fi
            echo
            echo
            echo "### Notable work in this fork"
            echo
            echo "- Fix world unload \`ClassCastException\` (\`CustomChunkLoader\` extends \`ChunkRegionLoader\` on 1.8–1.13)."
            echo "- CI and Release workflows are split (\`ci.yml\` vs \`release.yml\`)."
            echo "- Target support range: **1.8.8 through 1.17.1** (1.18+ deferred to ASWM)."
            echo
            echo "### Install"
            echo
            echo "1. Download the plugin JAR from this release."
            echo "2. Place it in the server \`plugins\` folder."
            echo "3. Restart and verify load/unload for your Minecraft version."
            echo
            echo "---"
            echo "_Auto-generated by GitHub Actions Release workflow from \`${TAG}\` (\`${GITHUB_SHA::7}\`)._"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Slime World Manager ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.tag, '-rc') || contains(steps.meta.outputs.tag, '-beta') || contains(steps.meta.outputs.tag, '-alpha') || contains(steps.meta.outputs.tag, 'SNAPSHOT') }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
